
# DATASOURCE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/demo30?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT CONFIGURATION
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=gameflix-api
app.jwt.expiration-minutes=60

# CORS CONFIGURATION
app.frontend.origin=http://localhost:5173

# DEVTOOLS
spring.devtools.livereload.enabled=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
